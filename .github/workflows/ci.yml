name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Generated catalog files match the ontology source
        run: |
          npm run ontology
          git diff --exit-code src/data/ontology.json supabase/migrations/
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Database rules
        run: npm run test:db
      - run: npm run build
      - name: Browser test of the connected app
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

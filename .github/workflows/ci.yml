name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Ontology JSON is in sync with the source
        run: |
          python3 ontology/build/export_json.py
          git diff --exit-code src/data/ontology.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Database schema loads
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -f db/schema.sql

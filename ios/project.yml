# Xcode project for the Wrynch iOS app, generated with XcodeGen (brew install xcodegen; then `xcodegen` in this folder).
# Before building, run `npm run ios:domain` in the repository root to bundle the shared inspection rules.
name: Wrynch
options:
  bundleIdPrefix: app.wrynch
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Wrynch:
    type: application
    platform: iOS
    sources:
      - path: Wrynch
        excludes:
          - "Resources/**"
      - path: Wrynch/Resources/wrynch-domain.js
        buildPhase: resources
    info:
      path: Wrynch/Info.plist
      properties:
        CFBundleDisplayName: Wrynch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Wrynch uses the camera to photograph the parts you inspect.
        ITSAppUsesNonExemptEncryption: false
        # Where the app's server lives (its /api routes, and the public database settings it hands out).
        WrynchAppURL: https://wrynch.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wrynch.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  WrynchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WrynchTests
        excludes:
          - "Fixtures/**"
      - path: WrynchTests/Fixtures/sample.json
        buildPhase: resources
    dependencies:
      - target: Wrynch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wrynch.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests run inside the app, so the bundled rules (wrynch-domain.js) are in Bundle.main.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wrynch.app/Wrynch
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Wrynch:
    build:
      targets:
        Wrynch: all
        WrynchTests: [test]
    test:
      targets:
        - WrynchTests
